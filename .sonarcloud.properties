# SonarCloud Automatic Analysis reads this repository directly, with sonar.sourceEncoding
# defaulting to UTF-8. The binary assets below hold NUL bytes and cannot be decoded as text, so
# every analysis ends with "There are problems with file encoding in the source code". None of
# them carries code, so excluding them removes the warning without narrowing what is analyzed.
sonar.exclusions=www/images/**,www/favicon.ico,www/favicon*.png
