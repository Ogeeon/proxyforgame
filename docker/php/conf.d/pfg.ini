; Matches the ini-values CI passes to setup-php (.github/workflows/playwright.yml).
post_max_size = 256M
upload_max_filesize = 256M

; The php:8.2-cli image ships no php.ini, so display_errors defaults to STDOUT
; and PHP warnings land inside the rendered HTML - which production (Apache
; mod_php) and CI never do. Keep them out of the page and in the log instead.
display_errors = Off
log_errors = On
error_reporting = E_ALL
