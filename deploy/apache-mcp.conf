# The public MCP endpoint, https://<site>/mcp, proxied to the Node server on
# loopback (deploy/pfg-mcp.service). Install a copy - not a reference into the
# checkout, which a rollback to an older commit would take away from under
# Apache's next reload - and include it inside BOTH site vhosts, the :443 ones
# for proxyforgame.net and proxyforgame.com:
#
#   a2enmod proxy proxy_http
#   install -m 644 <checkout>/deploy/apache-mcp.conf /etc/apache2/pfg-mcp.conf
#   Include /etc/apache2/pfg-mcp.conf                      (in each <VirtualHost *:443>)
#   apachectl configtest && systemctl reload apache2
#
# ProxyPass is matched before www/.htaccess is ever read, so the language
# rewrites cannot swallow /mcp. Only that exact path goes through: nothing else
# the Node process listens on (/healthz) is public.

ProxyPass        "/mcp" "http://127.0.0.1:8787/mcp" timeout=30
ProxyPassReverse "/mcp" "http://127.0.0.1:8787/mcp"

# Apache appends the client address to X-Forwarded-For on its own
# (ProxyAddHeaders is On by default); the server rate-limits on the last hop.
