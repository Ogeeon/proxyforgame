# Every `uses:` in .github/workflows is pinned to a full commit SHA (SonarQube
# githubactions:S7637). Pinning stops updates from arriving on their own, so Dependabot
# takes over: it reads the `# vX.Y.Z` comment next to each hash to learn the current
# version, and its PRs rewrite both the hash and the comment. Keep that comment on a
# full semver tag - a bare `# v4` gives Dependabot nothing to compare against and the
# action silently stops being updated.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" is the whole repository for this ecosystem - Dependabot scans
    # .github/workflows itself and does not want the subdirectory.
    directory: "/"
    schedule:
      interval: "monthly"
    # Skip versions younger than a week: a compromised release is usually caught
    # and pulled within days, before it would reach this repository.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    # One PR for all actions instead of one per patch release. Security updates still
    # arrive outside this schedule.
    groups:
      github-actions:
        patterns:
          - "*"

  # Bootstrap and Bootstrap Icons are served from www/vendor/, committed copies of the
  # versions package.json pins. A Dependabot PR bumps only package.json and the lock
  # file; workflows/dependabot-vendor.yml then runs `make vendor` on the PR branch,
  # pushes www/vendor/ and re-runs CI. Its first CI run fails on `make vendor-check`
  # by design - judge the PR by the run on the vendor commit, and still read the
  # release notes. Only these two packages are tracked; the dev tooling in
  # package.json is updated by hand.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "bootstrap"
      - dependency-name: "bootstrap-icons"
    # A Bootstrap major is a migration, not a monthly bump: v6 drops the UMD global
    # and renames components, events and CSS variables. It is taken on deliberately,
    # following docs/bootstrap-6-migration.md. Bootstrap Icons version on their own
    # scheme and are not held back.
    ignore:
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
    groups:
      bootstrap:
        patterns:
          - "bootstrap"
          - "bootstrap-icons"
