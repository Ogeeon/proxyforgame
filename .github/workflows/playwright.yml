# Named "CI" rather than after the browser suite: the job runs `make check`, the same
# green gate developers run before a commit, of which Playwright is only the last step.
# A green run here is what deploys, so the job invokes the `check` target itself rather
# than listing its parts: a gate added to the Makefile is then picked up here for free,
# and the two cannot drift (issue #21).
# The file name stays playwright.yml so the README badge URL and any existing links keep working.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Must be PFG_BASE_URL - that is the name playwright.config.js reads.
      PFG_BASE_URL: 'http://localhost:8000'
      DB_HOST: '127.0.0.1'
      DB_USER: 'pfg_usr'
      DB_PASS: 'secret'
      DB_NAME: 'proxyforgame'

    services:
      # MariaDB, not MySQL: production, the standby and local dev (WAMP 10.4.13)
      # all run MariaDB, and the engines diverge in SQL this project uses - e.g.
      # `ALTER TABLE ... ADD COLUMN IF NOT EXISTS` in a migration. 10.4 matches
      # local dev and is the conservative pick if production runs an older 10.x
      # than the standby. Bump this in step with the hosts.
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ${{ env.DB_NAME }}
          MARIADB_USER: ${{ env.DB_USER }}
          MARIADB_PASSWORD: ${{ env.DB_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # -------------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -------------------------------------------------------------
      # Install PHP (with Apache-like extensions)
      #
      # The version comes from .php-version, which is the single source of
      # truth: it must track production's PHP major.minor (see
      # docs/adr/0001-php-version-alignment.md). CI and production move
      # together - do not pin a version here.
      # -------------------------------------------------------------
      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version-file: '.php-version'
          extensions: mbstring, intl, mysqli
          ini-values: post_max_size=256M, upload_max_filesize=256M

      # -------------------------------------------------------------
      # Prepare the DB client and seed the schema. No .env is written - the
      # job-level DB_* environment variables are what make and the scripts read.
      # -------------------------------------------------------------
      - name: Prepare DB client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          echo "DB client installed; using job-level DB_* environment variables (no .env will be written)."

      - name: Seed the database
        run: |
          # Wait for the MariaDB service to accept connections, retry for up to ~60s
          for i in {1..30}; do
            if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASS" -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done

          echo "Importing schema.sql"
          make db-seed

      # `make db-seed` already ran the migrations once. Running them again must
      # be a no-op: anything printed means a migration re-applied, i.e. it does
      # not check what it already did.
      - name: Migrations are idempotent
        run: |
          out=$(make db-migrate)
          echo "$out"
          if echo "$out" | grep -q 'applying'; then
            echo "::error::db-migrate re-applied a migration on a second run"
            exit 1
          fi

      # -------------------------------------------------------------
      # Start PHP built-in server (no router needed)
      # -------------------------------------------------------------
      - name: Start PHP server
        working-directory: ${{ github.workspace }}/www
        run: |
          echo "------ Starting PHP server ------"
          php -S localhost:8000 > server.log 2>&1 &

          echo "Server PID: $!"

          # Wait for server to respond
          echo "------ Waiting for server... ------"
          for i in {1..30}; do
            if curl -s -I http://localhost:8000 | grep -q "200\|302"; then
              echo "Server is up!"
              break
            fi
            echo "Still waiting..."
            sleep 1
          done

          # If still not up → print logs
          if ! curl -s -I http://localhost:8000 | grep -q "200\|302"; then
            echo "Server did not start:"
            echo "------ server.log ------"
            cat server.log
            exit 1
          fi

      # -------------------------------------------------------------
      # Set up Node + Playwright
      # -------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # `make html-validate` runs the Nu Html Checker, a jar, against the rendered
      # pages. The jar itself arrives with the `vnu-jar` package that `make install`
      # pulls in; only a JRE has to be provided. Pinned rather than left to whatever
      # the runner image happens to preinstall.
      - name: Set up Java for the Nu Html Checker
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and browsers
        run: make install PW_DEPS=--with-deps

      # -------------------------------------------------------------
      # The gate - the same target developers run before a commit
      # -------------------------------------------------------------
      # `make check` is changelog-validate, i18n-validate, lint, typecheck,
      # tsconfigs-check, html-validate and both test suites, in that order: the
      # cheap gates fail in seconds, the browser suite runs last. Do not unroll
      # this back into one step per gate - a green run here is what deploys, so
      # anything the Makefile gates and this job does not is a hole in the
      # release gate, which is exactly how changelog-validate and html-validate
      # came to be missing (issue #21).
      #
      # PW_REPORTER: list for readable logs, html so the upload step below has
      # an artifact.
      - name: Green gate (make check)
        run: make check PW_REPORTER=list,html

      # Reporters that still flag pre-existing issues; `audit` prefixes each with
      # `-` so they are printed without failing the job.
      - name: Static analysis (advisory)
        if: always()
        run: make audit

      # -------------------------------------------------------------
      # Upload Playwright report (always)
      # -------------------------------------------------------------
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/