name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the repository owner and collaborators can summon Claude. The action itself
    # already refuses actors without write access, but that check happens after the job
    # has started - a stranger commenting `@claude` would still spin up a runner and
    # leave a dead entry in the Actions tab. Blocking here costs nothing and keeps
    # working if the action's internal check ever changes.
    #
    # author_association has to be read off the object that carries the text being
    # matched, per event: a comment payload also embeds `issue`, whose association is
    # the *issue author's*. One shared clause would let anyone trigger a run by
    # commenting under an issue the owner opened.
    #
    # MEMBER is deliberately absent - it only ever appears on organization repositories
    # and this one belongs to a user. Add it if the repository is ever transferred.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' ||
         github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    permissions:
      # These govern the built-in GITHUB_TOKEN, which is only the fallback here - the
      # push and the PR normally go through the App token minted below. Write is kept
      # so that a run with the App secrets missing still lands the branch somewhere
      # instead of throwing the work away; the job only ever starts for OWNER and
      # COLLABORATOR, so nothing untrusted reaches these permissions.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # A push authenticated with the built-in GITHUB_TOKEN deliberately does not
      # trigger other workflows, so playwright.yml would never run on Claude's PR.
      # A GitHub App installation token has no such restriction. Setup is manual and
      # documented in docs/agents/claude-workflow.md; until the two secrets exist this
      # step fails, `continue-on-error` swallows it, and the run degrades to
      # GITHUB_TOKEN rather than dying before Claude can even comment.
      - name: Mint a GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Claude commits and rebases here, and the "Preserve unpushed
          # work" step below cannot bundle commits out of a shallow clone.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Everything below the browser suite runs off a plain `npm ci` - no PHP, no
      # MySQL, no Playwright browsers - so give Claude that much for ~40s of setup.
      # `make test-e2e` and `make html-validate` stay with playwright.yml, which runs
      # on the pull request the App token lets Claude open.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # --ignore-scripts: a dependency's install/postinstall hook is arbitrary code
      # from the registry, and this job is the juiciest target in the repository -
      # contents/pull-requests write, the App private key and the Claude OAuth token
      # all sit in its environment. Nothing here needs the hooks: the only package
      # carrying one is vnu-jar, whose postinstall downloads a JRE that this job
      # never uses (`make html-validate` stays with playwright.yml, and it calls the
      # system `java` against the jar directly).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Without an allowlist every Bash call waits for an approval that cannot
          # arrive in a non-interactive run, so Claude silently ships untested work.
          # These cover the whole non-browser gate: `make changelog-validate
          # i18n-validate lint typecheck tsconfigs-check test-unit`.
          claude_args: >-
            --allowedTools
            "Bash(make:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*)"

      # Last line of defence for the thing that actually went wrong on issue #5: the
      # commit existed only inside the runner's checkout. Whatever the push did, any
      # local commit that is not on origin leaves here as a downloadable bundle
      # (`git clone claude-work.bundle`). Empty bundle -> `git bundle` exits non-zero
      # -> nothing to upload, which is the normal case once pushing works.
      - name: Preserve unpushed work
        id: bundle
        if: always()
        run: |
          if git bundle create "$RUNNER_TEMP/claude-work.bundle" --branches --not --remotes=origin; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Every local commit is already on origin - nothing to preserve."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unpushed work
        if: always() && steps.bundle.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-unpushed-work
          path: ${{ runner.temp }}/claude-work.bundle
          retention-days: 30

