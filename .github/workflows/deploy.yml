# The rollback lever.
#
# Normal deploys need nothing from this file: CI finishing green on main emits a
# workflow_run event, the receiver on the server sees conclusion == success and
# syncs. This workflow exists for the other direction - putting a specific older
# commit back on the site without opening a shell.
#
# The commit id has to reach the server somehow, and workflow_run does not carry
# inputs. Neither workflow_dispatch nor repository_dispatch can be subscribed to
# on a repository webhook - GitHub answers 422 for both; they are deliverable to
# a GitHub App only. What a repo hook may receive, and what exists for precisely
# this purpose, is `deployment`.
#
# So this workflow verifies the SHA and then creates a GitHub deployment for it.
# The useful consequence is that the check now gates the deploy instead of
# racing it: a SHA that is mistyped, unknown, or not an ancestor of main fails
# the job and no deployment is ever created.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to put on the servers (full 40 characters, must be on main)'
        required: true
        type: string

# Two rollbacks racing each other would be worse than either one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write   # creating the deployment below

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$REF" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::'$REF' is not a commit id. The server has already refused it."
            exit 1
          fi

          if ! git cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "::error::commit $REF does not exist in this repository"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$REF" origin/main; then
            echo "::error::commit $REF is not an ancestor of main - pfg-sync will refuse it"
            exit 1
          fi

          {
            echo "### Dispatched deploy"
            echo
            echo '```'
            git log -1 --format='%H%n%an, %ad%n%n%s%n%n%b' --date=iso "$REF"
            echo '```'
            echo
            echo "Behind main by $(git rev-list --count "$REF"..origin/main) commit(s)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only now, with the commit proven to exist and to be on main, is the
      # server told anything.
      #
      # auto_merge false: the default would try to merge main into the ref,
      # which is the opposite of what a rollback wants. required_contexts empty:
      # the checks were verified above, and an older commit's statuses can have
      # aged out of the API entirely.
      - name: Create the deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/deployments" --input - <<JSON
          {
            "ref": "$REF",
            "environment": "production",
            "auto_merge": false,
            "required_contexts": [],
            "description": "rollback dispatched from Actions"
          }
          JSON
          echo "deployment created for $REF"

      - name: Where to look next
        run: |
          echo "The receiver logs every delivery; the sync logs every reset and smoke result."
          echo "See deploy/README.md for the log paths on each host."
