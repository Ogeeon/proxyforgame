name: Watchdog

# Checks the site from outside, under each of its public names, and fails if
# it is not serving, has fallen behind the newest green commit of main, or has
# a cron job that stopped running. A failed run is the alarm: GitHub mails it
# to whoever last touched this file's schedule.
#
# This exists because a deploy-time smoke test only ever runs at deploy time.
# Between two deploys nothing else looks at the host.

# The schedule is best-effort on GitHub's side and drifts by minutes under
# load. That is fine here: the thresholds are hours, not minutes.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    steps:
      # Full history: the receiver-drift check hashes deploy/webhook.php at the
      # commit the host reports as deployed, which during a rollback is not the
      # tip. Pinned by digest and on the same version as the other workflows -
      # this one was still on a floating @v4.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the watchdog
        env:
          # deploy/watchdog.sh asks the API which commit last went green.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/watchdog.sh
